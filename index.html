    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0E13'/%3E%3Ccircle cx='9.5' cy='22.5' r='3.6' fill='%233A9FD4'/%3E%3Ccircle cx='16' cy='16' r='3.6' fill='%23BF8420'/%3E%3Ccircle cx='22.5' cy='9.5' r='3.6' fill='%23D9547B'/%3E%3C/svg%3E"
    />
    <script>
      // Every load starts at the top: no restored scroll position, and no #section jump from the URL.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      window.scrollTo(0, 0);
      // Some browsers (Firefox, Safari) still restore on reload unless the page is at the top when it unloads.
      window.addEventListener('beforeunload', () => window.scrollTo(0, 0));
    </script>
    <style>
      /* If the app never starts (for example the raw source is being served), don't leave a blank screen */
      #intro-veil { animation: veil-out 0.4s ease 6s forwards; }
      @keyframes veil-out { to { opacity: 0; visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="intro-veil" aria-hidden="true" style="position: fixed; inset: 0; z-index: 300; background: #0a0e13"></div>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif; color: #e8ecef; background: #0a0e13">
        Devang Kale, Data Scientist. Email devang.r.kale@gmail.com. This site needs JavaScript for its interactive sections.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
